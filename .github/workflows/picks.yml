name: lecturer-picks
on:
  workflow_dispatch:
  schedule:
    - cron: "30 21 * * 0-4"    # 00:30 الرياض بعد إغلاق أمريكا: تحديث نتائج الأسهم المذكورة
permissions:
  contents: write
concurrency:
  group: repo-writes
  cancel-in-progress: false
jobs:
  picks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pandas websocket-client requests && pip install git+https://github.com/rongardF/tvdatafeed
      - run: python scripts/picks_features.py
      - run: python scripts/nominate.py
        continue-on-error: true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add picks nominate
          git diff --cached --quiet && exit 0
          git commit -m "picks: $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
