name: probe-sources
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -A "Mozilla/5.0" "https://t.me/s/alphamarketsignalpulse" | sed 's/<[^>]*>/ /g' | tr -s ' \n' | head -c 600; echo
          curl -s -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130 Safari/537.36" "https://www.tiktok.com/@alphaxpulse" > /tmp/t.html; grep -o '/video/[0-9]\{19\}\|/photo/[0-9]\{19\}' /tmp/t.html | sort -u | head; grep -o '"desc":"[^"]\{0,80\}' /tmp/t.html | head -5; grep -c 'itemList\|ItemModule' /tmp/t.html
          curl -s -A "Mozilla/5.0" "https://nitter.net/AlphaXPulse" | sed 's/<[^>]*>/ /g' | tr -s ' \n' | head -c 300; echo
