name: daily-data
on:
  schedule:
    - cron: "40 12 * * 0-4"   # 15:40 الرياض، بعد إغلاق تاسي، الأحد–الخميس
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repo-writes
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install yfinance pandas matplotlib requests websocket-client && pip install git+https://github.com/rongardF/tvdatafeed || true
      - run: python scripts/fetch_data.py
      - name: course screen (card rows)
        continue-on-error: true   # فشل الفلترة لا يمنع حفظ بقية البيانات
        run: |
          python -m unittest discover -s tests
          python scripts/screen_course.py
      - run: python scripts/notify.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
