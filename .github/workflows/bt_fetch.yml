name: bt-fetch
on: workflow_dispatch
permissions:
  contents: write
concurrency:
  group: repo-writes
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pandas websocket-client requests && pip install git+https://github.com/rongardF/tvdatafeed
      - run: python scripts/bt_fetch.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bt
          git commit -m "bt: history $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
