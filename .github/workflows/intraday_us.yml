name: intraday-us
on:
  schedule:
    - cron: "*/15 13-20 * * 1-5"   # يغطي جلسة نيويورك صيفاً وشتاءً؛ السكربت يتحقق من ساعات الجلسة الفعلية
    - cron: "0,10 21 * * 1-5"
  workflow_dispatch:
    inputs:
      test: {description: 'رسالة تجربة', required: false, default: ''}
permissions:
  contents: write
  issues: write
concurrency:
  group: repo-writes
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests pandas websocket-client && pip install git+https://github.com/rongardF/tvdatafeed
      - run: python scripts/intraday_us.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEST_MSG: ${{ inputs.test }}
      - name: save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/intraday_us data/shapes 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "intraday-us: $(date -u +%F\ %H:%M)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
