name: rank-mentions
# تشغيل يدوي: بيانات اليوم لكل الأسهم التي ذكرها أبو خالد لمفاضلتها بمعاييره (بطلب المستخدم 2026-11-22)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repo-writes
  cancel-in-progress: false
jobs:
  rank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pandas websocket-client requests && pip install git+https://github.com/rongardF/tvdatafeed
      - run: python scripts/rank_mentions.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add picks/ranking_data.json
          git diff --cached --quiet && exit 0
          git commit -m "rank: $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
